name: ci
on: [pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Run Flutter Analyze
        run: flutter analyze
      - name: Run Flutter Test (Campus Notify)
        working-directory: 07-Week-7-Clean-Architecture/Lib/campus_notify
        run: |
          flutter pub get
          flutter test

